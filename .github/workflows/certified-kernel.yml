name: Certified settlement kernel

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pact_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pact_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pact_ci -d pact_ci_test" --health-interval
          5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pact_ci@127.0.0.1:5432/pact_ci_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: npm ci
      - run: node scripts/verify-certified-kernel.mjs
      - run: node scripts/test-certified-kernel.mjs
      - run: npm run database:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:database-live
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - working-directory: packages/contracts
        run: forge fmt --check
      - working-directory: packages/contracts
        run: forge build
      - working-directory: packages/contracts
        run: forge test -vv
